# Pages CMS configuration — https://pagescms.org/docs/
# Editing UI for Dru & Ashley at https://app.pagescms.org
# Each entry below maps a content/*.json file to a friendly editing form.
# content/site.json is deliberately NOT listed (dev-maintained SEO data).

components:
