        type: string
        description: 'Shown in brackets after the class, e.g. "on break until September"'

content:
  - name: programs
    label: Programs
    type: file
    path: content/programs.json
    format: json
    fields:
      - name: programs
        label: Program cards
        type: object
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: eyebrow
            label: Category tag
            type: string
            required: true
            description: 'Small text above the title, e.g. "Adults • Gi"'
          - name: title
            label: Program name
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
            description: One or two sentences describing the class.
          - name: highlights
            label: Bullet points
            type: string
            list:
              min: 1
              max: 4
            description: Short selling points shown as bullets (3 looks best).

  - name: schedule
    label: Weekly Schedule
    type: file
    path: content/schedule.json
    format: json
    fields:
      - name: monday
        label: Monday
        component: day_classes
      - name: tuesday
        label: Tuesday
        component: day_classes
      - name: wednesday
        label: Wednesday
        component: day_classes
      - name: thursday
        label: Thursday
        component: day_classes
      - name: friday
        label: Friday
        component: day_classes
      - name: saturday
        label: Saturday
        component: day_classes
      - name: sunday
        label: Sunday
        component: day_classes

  - name: memberships
    label: Membership Pricing
    type: file
    path: content/memberships.json
    format: json
    fields:
      - name: plans
        label: Membership plans
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name} — ${price}{period}"
        fields:
          - name: name
            label: Plan name
            type: string
            required: true
          - name: price
            label: Price (numbers only, no $)
            type: string
            required: true
            pattern:
              regex: "^\\d+(\\.\\d{2})?$"
              message: "Enter just the number, like 138 or 172.50"
          - name: period
            label: Billing period
            type: string
            required: true
            description: 'Usually "/month". Also e.g. "/6-week program".'
          - name: highlight
            label: Featured plan (gold card)
            type: boolean
            description: Only one plan should be featured.
          - name: description
            label: Description
            type: text
            required: true
          - name: features
            label: What's included
            type: string
            list:
              min: 1
              max: 4

  - name: team
    label: Team & Belt Roster
    type: file
    path: content/team.json
    format: json
    fields:
      - name: lead_instructor
        label: Lead Instructor
        type: object
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: photo
            label: Photo URL
            type: string
            readonly: true
            description: Ask Michael to change the photo.
          - name: bio
            label: Bio
            type: text
            required: true
            description: Shown after the name. Update when ranks or experience change.
      - name: belts
        label: Belt Roster
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{belt}"
        fields:
          - name: belt
            label: Belt
            type: select
            required: true
            options:
              values: [Black Belt, Brown Belt, Purple Belt, Blue Belt, White Belt]
          - name: members
            label: Members
            type: string
            list: true
            description: One name per entry. To promote someone, remove their name here and add it under the higher belt.
